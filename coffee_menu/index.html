<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coffee Shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header><p class="eyebrow">Freshly brewed</p><h1>☕ Coffee Shop</h1><p>Choose your favorites and build your order.</p></header>
    <div class="layout">
      <div>
        <section><h2>Menu</h2><ul id="menu-list"></ul></section>
        <section><h2>Add a custom item</h2><div class="form-fields"><input type="text" id="item-name" placeholder="Item name" aria-label="Item name"><input type="text" id="item-price" placeholder="Price" aria-label="Price"><button id="add-custom-btn">Add to menu</button></div><p id="error-msg" role="status"></p></section>
      </div>
      <section class="cart-section"><h2>Cart (<span id="cart-count">0</span> items)</h2><ul id="cart-list"></ul><p class="total">Total: $<span id="cart-total">0.00</span></p><p id="reward-msg" class="hidden">🍪 Free cookie unlocked!</p><button id="clear-cart-btn">Clear cart</button></section>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
